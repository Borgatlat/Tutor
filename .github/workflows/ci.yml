name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test -- --ci

      - name: Web build
        run: npx expo export --platform web --output-dir dist

      - name: iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios
