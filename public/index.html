<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      touch-action: manipulation stops the 300ms click delay on iOS Safari.
      initial-scale=1 keeps the viewport correct; pinch-zoom stays available.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>Strake Jesuit Tutors</title>
    <meta name="theme-color" content="#1B4D2E" />
    <meta name="description" content="Peer-to-peer SAT & AP tutoring for Strake Jesuit students" />

    <!--
      NOTE: this file must live at public/index.html, not web/index.html.
      Expo's Metro web bundler reads its HTML template from public/; a template
      in web/ is silently ignored and you get Expo's default page instead,
      which is how these font links went missing the first time.

      Source Serif 4 for headings; IBM Plex Sans for body, chosen over Inter,
      which reads as the default of every generated interface.
      display=swap paints fallback text immediately, then swaps.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700;8..60,800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- react-native-web recommended reset -->
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>

    <!--
      iOS Safari keyboard fix: react-native-web sets user-select:none on View
      containers, which stops mobile Safari showing the keyboard when an input
      is tapped. Force text inputs back to selectable and kill the tap delay.
    -->
    <style id="ios-input-fix">
      input,
      textarea,
      [contenteditable] {
        -webkit-user-select: text !important;
        user-select: text !important;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        /* under 16px makes iOS Safari zoom on focus */
        font-size: max(16px, 1em);
      }

      input::placeholder,
      textarea::placeholder { font-size: inherit; }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"],
      input[type="search"],
      textarea {
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
